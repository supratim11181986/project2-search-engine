AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'

Resources:
  pdftotxt:
    Type: 'AWS::Serverless::Function'
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.7
      CodeUri: .
      MemorySize: 512
      Timeout: 900
      Role: arn:aws:iam::470693845209:role/Project2-OpenSearch-Lambda-Role

      Environment:
        Variables:
          TARGET_BUCKET: project2-processed-text-supratim