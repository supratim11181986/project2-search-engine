version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - pip install requests -t SearchFunction/
      - pip install requests-aws4auth -t SearchFunction/

  build:
    commands:
      - aws cloudformation package --template-file SearchFunction/search-function.yaml --s3-bucket project2-codepipeline-artifacts-supratim --output-template-file search.yaml

artifacts:
  files:
    - search.yaml