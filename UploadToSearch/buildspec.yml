version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - pip install requests -t UploadToSearch/
      - pip install requests-aws4auth -t UploadToSearch/

  build:
    commands:
      - aws cloudformation package --template-file UploadToSearch/upload-to-search.yaml --s3-bucket project2-codepipeline-artifacts-supratim --output-template-file upload.yaml

artifacts:
  files:
    - upload.yaml